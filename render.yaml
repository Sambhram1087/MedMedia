# Render Blueprint: New + > Blueprint, pick this repo.
databases:
  - name: medmedia-db
    plan: basic-256mb

services:
  - type: web
    name: medmedia
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medmedia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false # you will be asked for this on first deploy
      - key: STORAGE_DRIVER
        value: s3 # create an R2/S3 bucket first, then fill in the S3_* variables below
      - key: S3_BUCKET
        sync: false
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
